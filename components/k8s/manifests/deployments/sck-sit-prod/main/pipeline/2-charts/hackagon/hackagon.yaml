---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: hackagon
  namespace: flux-system
spec:
  ref:
    semver: "0.5.0"
---
# Per-cluster, non-secret overrides.
#
# kustomize has no schema for HelmRelease, so this merges as RFC-7386: maps
# merge key-by-key, LISTS ARE REPLACED WHOLESALE. `ingress.hosts` / `tls` must
# therefore be restated in full. Do not add `valuesFrom:` here -- it would
# replace the base list and drop the secret (see c58a85a).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hackagon
  namespace: hackagon
spec:
  values:
    baseDomain: sck-sit-prod.dscompute.ch

    frontend:
      ingress:
        hosts:
          - host: "hackagon.sck-sit-prod.dscompute.ch"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: "hackagon-frontend-tls"
            hosts:
              - "hackagon.sck-sit-prod.dscompute.ch"
              - '{{ include "hackagon.frontendHost" . }}'
        oidc:
          audience: hackagon-backend

    backend:
      config:
        oidc:
          jwksurl: 'http://{{ include "hackagon.keycloakServiceName" . }}:8080/realms/hackagon/protocol/openid-connect/certs'

    keycloak:
      hostname:
        hostname: "https://auth-hackagon.sck-sit-prod.dscompute.ch"
