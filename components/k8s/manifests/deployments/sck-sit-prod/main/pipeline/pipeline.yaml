apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  wait: true
  path: "components/k8s/manifests/deployments/sck-sit-prod/main/pipeline/0-certmanager"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configuration
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 5m
  wait: true
  path: "components/k8s/manifests/deployments/sck-sit-prod/main/pipeline/1-configuration"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: charts
  namespace: flux-system
spec:
  dependsOn:
    - name: configuration
  interval: 5m
  path: "components/k8s/manifests/deployments/sck-sit-prod/main/pipeline/2-charts"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
