---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  finalizers:
    - finalizers.fluxcd.io
  name: sops-cluster-secrets
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  force: false
  interval: 10m0s
  path: ./components/k8s/manifests/deployments/sck-sit-dev/secrets/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
