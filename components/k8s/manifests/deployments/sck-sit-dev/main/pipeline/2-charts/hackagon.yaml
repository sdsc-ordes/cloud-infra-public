---
# Per-cluster, non-secret overrides.
#
# kustomize has no schema for HelmRelease, so this merges as RFC-7386: maps
# merge key-by-key, LISTS ARE REPLACED WHOLESALE. `ingress.hosts` / `tls` must
# therefore be restated in full. Do not add `valuesFrom:` here -- it would
# replace the base list and drop the secret (see c58a85a).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hackagon
  namespace: hackagon
spec:
  values:
    baseDomain: hackagon-dev.dscompute.ch

    frontend:
      image:
        repository: ghcr.io/swissdatasciencecenter/hackagon/temporary/frontend-service
        tag: "latest"
        pullPolicy: Always
      ingress:
        hosts:
          - host: "app.hackagon-dev.dscompute.ch"
            paths:
              - path: /
                pathType: Prefix
          - host: "hackagon.sck-sit-dev.dscompute.ch"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: "hackagon-frontend-tls"
            hosts:
              - '{{ include "hackagon.frontendHost" . }}'
              - "hackagon.sck-sit-dev.dscompute.ch"

    backend:
      image:
        repository: ghcr.io/swissdatasciencecenter/hackagon/temporary/backend-service
        tag: "latest"
        pullPolicy: Always
      config:
        oidc:
          jwksurl: 'http://{{ include "hackagon.keycloakServiceName" . }}:8080/realms/hackagon/protocol/openid-connect/certs'

    keycloak:
      hostname:
        hostname: "https://auth.hackagon-dev.dscompute.ch"
