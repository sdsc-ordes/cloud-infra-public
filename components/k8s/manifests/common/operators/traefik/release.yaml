---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    # Chart 41.5.0 == Traefik v3.7.13.
    tag: "41.5.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  releaseName: traefik
  interval: 1h
  values:
    # The chart creates IngressClass `traefik` and enables the
    # kubernetesIngress provider.
    ingressClass:
      enabled: true
      # Be explicit rather than silently adopting every Ingress that omits a class.
      isDefaultClass: false

    service:
      # Needs a LoadBalancer implementation in the cluster. If EXTERNAL-IP
      # stays <pending>, switch to NodePort.
      type: LoadBalancer

    providers:
      kubernetesCRD:
        # Collision-safe naming: breaking to flip once CRDs are in use.
        safeNaming: true
      kubernetesIngress:
        enabled: true
      kubernetesGateway:
        enabled: true

    gateway:
      listeners:
        web:
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All

    ports:
      web:
        http:
          # These entryPoints front Keycloak, which trusts X-Forwarded-*.
          aliasHeadersStrategy: delete
          # Global HTTP->HTTPS redirect, replacing the per-Ingress
          # nginx.ingress.kubernetes.io/ssl-redirect annotation.
          # websecure.http.tls.enabled is already true by default.
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          aliasHeadersStrategy: delete
