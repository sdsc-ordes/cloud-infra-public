---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  namespace: niks3
  name: niks3
spec:
  interval: 5m
  url: https://github.com/Mic92/niks3
  ref:
    # On main with patch from: https://github.com/Mic92/niks3/pull/537
    # WARNING: If you update this!
    #          CHECK: NIKS3_REV in `cache-check.yaml`
    commit: 43a0e5fb0723c0a0f11137bc29ad014bc3b648ff
  ignore: |
    /*
    !/deploy/helm/niks3/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: niks3
  namespace: niks3
spec:
  chart:
    spec:
      chart: ./deploy/helm/niks3 # path inside the Git repo
      sourceRef:
        kind: GitRepository
        name: niks3
      reconcileStrategy: Revision # Rebuild chart on every new Git commit.
      interval: 5m

  releaseName: niks3

  interval: 5m
  timeout: 40m
  install:
    disableWait: true
    remediation:
      retries: 3

  values:
    image:
      tag: v1.13.0
    auth:
      existingSecret: niks3-api-token
    database:
      existingSecret: niks3-db-connect-uri
    signing:
      existingSecret: niks3-signing-key
      keys: [signing-key]
    s3:
      existingSecret: niks3-s3-creds
